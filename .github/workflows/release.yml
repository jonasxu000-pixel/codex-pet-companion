name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\CodexUsageWidget\CodexUsageWidget.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version."
          }

      - name: Build and test portable release
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime win-x64

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $archive = '.\artifacts\release\codex-pet-companion-win-x64.zip'
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  codex-pet-companion-win-x64.zip" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\artifacts\release\codex-pet-companion-win-x64.zip `
            .\artifacts\release\codex-pet-companion-win-x64.zip.sha256 `
            --verify-tag `
            --generate-notes `
            --title "Codex Pet Companion $env:GITHUB_REF_NAME"
